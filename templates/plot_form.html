
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ plot_type|capitalize }} Plot - GeoPyTool Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 2rem;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .plot-container {
            margin-top: 2rem;
            text-align: center;
        }
        .plot-image {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ plot_type|capitalize }} Plot</h1>
            <p class="lead">Configure your plot parameters</p>
        </div>
        
        <div class="mb-3">
            <a href="/" class="btn btn-primary">Back to Home</a>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        Plot Parameters
                    </div>
                    <div class="card-body">
                        <form id="plot-form">
                            {% if plot_type == 'xy' %}
                            <div class="mb-3">
                                <label for="x_column" class="form-label">X Column</label>
                                <select class="form-select" id="x_column" name="x_column" required>
                                    <option value="">Select X Column</option>
                                    {% for col in columns %}
                                    <option value="{{ col }}">{{ col }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="y_column" class="form-label">Y Column</label>
                                <select class="form-select" id="y_column" name="y_column" required>
                                    <option value="">Select Y Column</option>
                                    {% for col in columns %}
                                    <option value="{{ col }}">{{ col }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            {% endif %}
                            
                            <div class="mb-3">
                                <label for="label_column" class="form-label">Label Column (optional)</label>
                                <select class="form-select" id="label_column" name="label_column">
                                    <option value="">No Label</option>
                                    {% for col in columns %}
                                    <option value="{{ col }}">{{ col }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="index_column" class="form-label">Index Column (optional)</label>
                                <select class="form-select" id="index_column" name="index_column">
                                    <option value="">No Index</option>
                                    {% for col in columns %}
                                    <option value="{{ col }}">{{ col }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="size_column" class="form-label">Size Column (optional)</label>
                                <select class="form-select" id="size_column" name="size_column">
                                    <option value="">Default Size</option>
                                    {% for col in columns %}
                                    <option value="{{ col }}">{{ col }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <button type="submit" class="btn btn-success">Generate Plot</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="plot-container" id="plot-container" style="display: none;">
                    <div class="card">
                        <div class="card-header">
                            Plot Result
                        </div>
                        <div class="card-body">
                            <img id="plot-image" class="plot-image" src="" alt="Plot result">
                            <div class="mt-3">
                                <a id="download-link" href="#" class="btn btn-primary" download>Download Plot</a>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="plot-status" class="mt-3"></div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('plot-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const statusDiv = document.getElementById('plot-status');
            
            statusDiv.innerHTML = '<div class="alert alert-info">Generating plot...</div>';
            
            fetch('/plot/{{ plot_type }}', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusDiv.innerHTML = '';
                    document.getElementById('plot-container').style.display = 'block';
                    document.getElementById('plot-image').src = data.image;
                    document.getElementById('download-link').href = '/download/' + data.plot_id;
                } else {
                    statusDiv.innerHTML = '<div class="alert alert-danger">Error: ' + data.error + '</div>';
                }
            })
            .catch(error => {
                statusDiv.innerHTML = '<div class="alert alert-danger">Error: ' + error.message + '</div>';
            });
        });
    </script>
</body>
</html>
