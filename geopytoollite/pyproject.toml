# This project was generated with 0.3.25 using template: https://github.com/beeware/briefcase-template @ v0.3.25
[tool.briefcase]
project_name = "GeoPyToolLite"
bundle = "com.geopytool"
version = "0.0.1"
url = "https://geopytool.com"
license.file = "LICENSE"
author = "cycleuser"
author_email = "wedonotuse@outlook.com"

[tool.briefcase.app.geopytoollite]
formal_name = "GeoPyToolLite"
description = "A Lite version of GeoPyTool"
long_description = """More details about the app should go here.
"""
sources = [
    "src/geopytoollite",
]
test_sources = [
    "tests",
]

requires = [
    "PySide6",
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "pyqtgraph",
    "openpyxl",
    "scikit-learn",
    # "PySide6-Addons~=6.8",
]
test_requires = [
    "pytest",
]

[tool.briefcase.app.geopytoollite.macOS]
universal_build = true
# As of Pyside 6.8, PySide enforces a macOS 12 minimum on wheels.
min_os_version = "12.0"
requires = [
    "std-nslog~=1.0.3",
]

[tool.briefcase.app.geopytoollite.linux]
requires = [
]

