name: Build Windows MSI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Briefcase
        run: pip install briefcase

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Create Windows app
        run: briefcase create windows
        working-directory: geopytool_reborn

      - name: Build Windows app
        run: briefcase build windows
        working-directory: geopytool_reborn

      - name: Package Windows MSI
        run: briefcase package windows
        working-directory: geopytool_reborn

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoPyTool-Reborn-Windows
          path: geopytool_reborn/dist/*.msi
