[package]
name = "georustool"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A Rust reimplementation of GeoPyTool desktop app (skeleton)."

[dependencies]
eframe = "0.27.2"
egui = "0.27.2"
egui_extras = { version = "0.27.2", features = ["image"] }
egui_plot = "0.27.2"
rfd = "0.14.1"
csv = "1.3.0"
calamine = { version = "0.24.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
once_cell = "1.19"
time = { version = "0.3", features = ["formatting", "serde"] }

plotters = "0.3.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1


